# Self-hosted hooks for developing this repo.
# ruff is deliberately NOT a pre-commit hook here: the PyPI binary can't run
# on NixOS (stub-ld), which fails every commit. Run it via `make lint` /
# `make fmt` (nixpkgs#ruff) or CI instead.
repos:
  # Dogfood: review every commit in this repo with the pi-review hook.
  - repo: git@github.com:Fifty-Nine/pi-review-hook.git
    rev: 0026c0b15cf267d2105c010d576ecda15676f9f7
    hooks:
      - id: pi-review
        args: ["--model", "ollama/glm-5.2:cloud", "--archive-sessions"]
