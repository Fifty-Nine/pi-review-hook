[project]
name = "pi-review-precommit"
version = "0.1.0"
description = "Agentic AI code review pre-commit hook using pi"
license = "MIT"
readme = "README.md"
authors = [
    { name = "Tim Prince", email = "tim.prince@gmail.com" }
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pi-review = "pi_review_precommit.hook:main"
pi-review-notes = "pi_review_precommit.notes:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_review_precommit"]

[tool.hatch.build.targets.wheel.force-include]
"src/pi_review_precommit/extension.ts" = "pi_review_precommit/extension.ts"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
